name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, format, types, tests, evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # guardrails.py, costs.py, observability.py and evals/scorers.py are
      # standard-library only by design, so this entire gate runs without
      # installing a model client or a vector store. It finishes in seconds.
      - name: Install tooling
        run: python -m pip install --quiet pytest ruff mypy
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest
      - name: Offline evals
        run: python -m evals.run

  service-import:
    name: service imports (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Import the graph
        run: python -c "import graph; print(len(graph.APP.get_graph().nodes), 'nodes')"